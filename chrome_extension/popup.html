<!DOCTYPE html>
<html>
<head>
  <title>Employee Email Finder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 360px;
      padding: 20px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 13px;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #a0cbfc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
      word-break: break-all;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .loading {
      text-align: center;
      margin-top: 20px;
      display: none;
    }
    .progress-log {
      margin-top: 15px;
      text-align: left;
      background: #1e1e1e;
      color: #00ff00;
      border-radius: 6px;
      padding: 10px;
      height: 180px;
      overflow-y: auto;
      font-size: 11px;
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .log-entry {
      margin-bottom: 2px;
    }
    .log-error {
      color: #ff5555;
    }
    .log-success {
      color: #55ff55;
    }
    .log-warning {
      color: #ffaa00;
    }
    .watermark {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      font-size: 10px;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }
    .watermark a {
      color: #0066cc;
    }
  </style>
</head>
<body>
  <h2>Employee Email Finder</h2>
  <div class="form-group">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" placeholder="First name">
  </div>
  <div class="form-group">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" placeholder="Last name">
  </div>
  <div class="form-group">
    <label for="company">Company Name</label>
    <input type="text" id="company" placeholder="Company name">
  </div>
  <button id="findBtn">Find Email</button>
  <button id="stopBtn" style="display: none; background-color: #dc3545;">Stop Search</button>
  
  <div id="loading" class="loading">
    <div id="loadingHeader"></div>
    <div id="progressLog" class="progress-log"></div>
  </div>
  <div id="result"></div>

  <footer class="watermark">
    Open source. See your project repository for maintainers, license, and documentation.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
