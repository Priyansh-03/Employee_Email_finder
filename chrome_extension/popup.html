<!DOCTYPE html>
<html>
<head>
  <title>Employee Email Finder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 360px;
      padding: 20px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 13px;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #a0cbfc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
      word-break: break-all;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .loading {
      text-align: center;
      margin-top: 20px;
      display: none;
    }
    .anim-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 6px;
    }
    .spinner {
      width: 56px;
      height: 56px;
      position: relative;
      margin-bottom: 16px;
    }
    .ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #e0eaff;
      border-top-color: #007bff;
      border-right-color: #4da3ff;
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-sizing: border-box;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .anim-for {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      letter-spacing: 0.03em;
    }
    .anim-name {
      font-size: 17px;
      font-weight: 700;
      color: #007bff;
      margin-bottom: 14px;
    }
    .anim-status {
      font-size: 13px;
      color: #444;
      min-height: 20px;
      animation: fadeStatus 0.4s ease;
    }
    @keyframes fadeStatus {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pulse-dots {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .pulse-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #007bff;
      animation: pulse 1.2s ease-in-out infinite;
      opacity: 0.3;
    }
    .pulse-dots span:nth-child(1) { animation-delay: 0s; }
    .pulse-dots span:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50%       { opacity: 1;   transform: scale(1.15); }
    }
    .watermark {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      font-size: 10px;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }
    .watermark a {
      color: #0066cc;
    }
  </style>
</head>
<body>
  <h2>Employee Email Finder</h2>
  <div class="form-group">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" placeholder="First name">
  </div>
  <div class="form-group">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" placeholder="Last name">
  </div>
  <div class="form-group">
    <label for="company">Company Name</label>
    <input type="text" id="company" placeholder="Company name">
  </div>
  <button id="findBtn">Find Email</button>
  <button id="stopBtn" style="display: none; background-color: #dc3545;">Stop Search</button>
  
  <div id="loading" class="loading">
    <div class="anim-wrapper">
      <div class="spinner"><div class="ring"></div></div>
      <div class="anim-for">Finding email for</div>
      <div class="anim-name" id="animName"></div>
      <div class="anim-status" id="animStatus">Connecting...</div>
      <div class="pulse-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div id="result"></div>

  <footer class="watermark">
    Open source. See your project repository for maintainers, license, and documentation.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
